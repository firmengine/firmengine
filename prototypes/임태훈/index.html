<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원본 대조 검증</title>
<!-- 스펙: docs/specs/임태훈-source-verify.md -->

<style>
/* ── 디자인 토큰: 색 · 간격 · 글자 크기 · 모양 */
:root {
  /* 색: 흰색·연회색 바탕, 강조색은 네이비 하나 */
  --c-bg: #f5f7fa;
  --c-surface: #ffffff;
  --c-subtle: #f8fafc;
  --c-muted-bg: #f1f4f8;
  --c-border: #e3e8ef;
  --c-border-strong: #cfd6e0;
  --c-text: #0f1b2d;
  --c-text-2: #475467;
  --c-text-3: #8a94a6;
  --c-accent: #1b2f5b;
  --c-accent-hover: #142446;
  --c-accent-tint: #edf1f8;
  --c-accent-line: #c9d3e6;
  --c-err: #b42318; --c-err-bg: #fef3f2; --c-err-line: #fecdca;
  --c-warn: #b54708; --c-warn-bg: #fffaeb; --c-warn-line: #fedf89;
  --c-ok: #067647; --c-ok-bg: #ecfdf3; --c-ok-line: #abefc6;
  --c-hl: #ffef9e; --c-hl-line: #c98a00;   /* 강조 칸 (노랑) */
  --c-chg: #d1fadf;                        /* 바뀐 값 (초록) */
  --c-paper-bg: #eceff3;                   /* 서류 뷰어 바탕 (연회색) */
  --c-paper-edge: #d5dbe3;                 /* 종이 가장자리 */
  --c-paper-text: #0b1220;                 /* 종이 위 글자 */
  /* 간격 */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
  /* 글자 크기 */
  --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-lg: 15px; --fs-xl: 18px; --fs-2xl: 28px;
  /* 모양 */
  --radius: 12px; --radius-sm: 8px; --radius-pill: 999px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .04);
  --radius-paper: 6px;
  --fs-paper: 14px;
  /* 종이 그림자: 아래로 퍼지는 부드러운 두 겹. 마우스를 올리면 조금 커집니다. */
  --shadow-paper: 0 2px 6px -1px rgba(16, 24, 40, .10), 0 14px 30px -8px rgba(16, 24, 40, .24);
  --shadow-paper-hover: 0 4px 10px -2px rgba(16, 24, 40, .12), 0 22px 44px -10px rgba(16, 24, 40, .30);
  --font: "Pretendard", "Pretendard Variable", system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--c-bg); color: var(--c-text); font: var(--fs-md)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
table { border-collapse: collapse; width: 100%; }

/* ── 버튼 · 입력 */
button { cursor: pointer; border: 1px solid var(--c-border-strong); background: var(--c-surface); border-radius: var(--radius-sm);
  padding: 5px 12px; font-size: var(--fs-sm); font-weight: 500; transition: background .12s, border-color .12s; }
button:hover:not(:disabled) { background: var(--c-subtle); border-color: var(--c-text-3); }
button:disabled { cursor: not-allowed; color: var(--c-text-3); background: var(--c-subtle); }
button.primary { background: var(--c-accent); border-color: var(--c-accent); color: #fff; }
button.primary:hover:not(:disabled) { background: var(--c-accent-hover); border-color: var(--c-accent-hover); }
button.primary:disabled { background: var(--c-muted-bg); border-color: var(--c-border); color: var(--c-text-3); }
button.ghost { border-color: transparent; background: transparent; color: var(--c-text-2); }
button.ghost:hover:not(:disabled) { background: var(--c-muted-bg); border-color: transparent; }
button.sm { padding: 3px 10px; font-size: var(--fs-xs); }
button.lg { padding: 12px 28px; font-size: var(--fs-lg); font-weight: 700; border-radius: 10px; }
select, input { border: 1px solid var(--c-border-strong); border-radius: var(--radius-sm); background: var(--c-surface); padding: 5px 8px; font-size: var(--fs-sm); }
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--c-accent-line); outline-offset: 1px; }

/* ── 칩: 등급 · 상태 · 처리 구분 */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: var(--radius-pill); border: 1px solid transparent;
  font-size: var(--fs-xs); font-weight: 600; line-height: 20px; white-space: nowrap; vertical-align: middle; }
.chip-err { background: var(--c-err-bg); color: var(--c-err); border-color: var(--c-err-line); }
.chip-warn { background: var(--c-warn-bg); color: var(--c-warn); border-color: var(--c-warn-line); }
.chip-ok { background: var(--c-ok-bg); color: var(--c-ok); border-color: var(--c-ok-line); }
.chip-done { background: var(--c-muted-bg); color: var(--c-text-2); border-color: var(--c-border); }
.chip-approve { background: var(--c-accent-tint); color: var(--c-accent); border-color: var(--c-accent-line); }
.chip-keep { background: var(--c-surface); color: var(--c-text-2); border-color: var(--c-border-strong); border-style: dashed; }
.chip-info { background: var(--c-muted-bg); color: var(--c-text-2); border-color: var(--c-border); font-weight: 500; }

/* ── 앱 바 */
.appbar { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--sp-4);
  min-height: 60px; padding: var(--sp-2) var(--sp-6); background: var(--c-surface); border-bottom: 1px solid var(--c-border); }
.brand { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-lg); font-weight: 700; white-space: nowrap; }
.brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--c-accent); color: #fff; display: grid; place-items: center; flex: none; }
.brand .sep { color: var(--c-text-3); font-weight: 400; }
.brand .sub { color: var(--c-text-2); font-weight: 600; }
.steps { display: flex; align-items: center; gap: var(--sp-1); }
.step { display: inline-flex; align-items: center; gap: 6px; border: none; background: none; padding: 6px 12px 6px 6px; border-radius: var(--radius-pill);
  color: var(--c-text-3); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.step .no { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 700; border: 1.5px solid currentColor; }
.step.is-done { color: var(--c-text-2); }
.step.is-done .no { background: var(--c-text-2); border-color: var(--c-text-2); color: #fff; }
.step.is-current { color: var(--c-accent); background: var(--c-accent-tint); font-weight: 700; }
.step.is-current .no { background: var(--c-accent); border-color: var(--c-accent); color: #fff; }
button.step:disabled { background: none; color: var(--c-text-3); }
.step-arrow { color: var(--c-border-strong); }
.appbar-tools { display: flex; justify-content: flex-end; align-items: center; gap: var(--sp-2); }
.appbar-tools label { display: flex; align-items: center; gap: 6px; color: var(--c-text-2); font-size: var(--fs-sm); }
.appbar-tools label, .appbar-tools button { white-space: nowrap; }
@media (max-width: 1080px) {
  .appbar { grid-template-columns: 1fr auto; }
  .steps { grid-column: 1 / -1; grid-row: 2; overflow-x: auto; }
}
@media (max-width: 560px) {
  .appbar { grid-template-columns: 1fr; }
  .appbar-tools { justify-content: flex-start; }
}

/* ── 페이지 · 카드 */
.page { max-width: 1440px; margin: 0 auto; padding: var(--sp-6) var(--sp-6) 64px; }
.page-head { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-5); }
.page-head .titles { flex: 1; min-width: 220px; }
.page-head h1 { font-size: var(--fs-xl); font-weight: 700; }
.page-head .desc { margin-top: 2px; color: var(--c-text-2); font-size: var(--fs-sm); }
.card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-5) var(--sp-5) var(--sp-4); flex-wrap: wrap; }
.card-head .titles { flex: 1; min-width: 180px; }
.card-title { font-size: var(--fs-lg); font-weight: 700; }
.card-desc { margin-top: 2px; color: var(--c-text-2); font-size: var(--fs-sm); }
.card-body { padding: 0 var(--sp-5) var(--sp-5); }
.muted { color: var(--c-text-3); }
.empty { padding: var(--sp-6); text-align: center; color: var(--c-text-3); }

/* ── 초입 화면 */
.intake { max-width: 1040px; margin: 0 auto; }
.intake-grid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: var(--sp-5); align-items: start; }
@media (max-width: 860px) { .intake-grid { grid-template-columns: 1fr; } }
.kv th, .kv td { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--c-border); }
.kv th { width: 96px; color: var(--c-text-2); font-weight: 500; }
.kv td { font-weight: 600; }
.kv tr:last-child th, .kv tr:last-child td { border-bottom: none; }
.dropzone { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); padding: var(--sp-6) var(--sp-4);
  border: 1.5px dashed var(--c-border-strong); border-radius: var(--radius-sm); background: var(--c-subtle); text-align: center; color: var(--c-text-2); }
.dropzone .icon { width: 44px; height: 44px; border-radius: 50%; background: var(--c-accent-tint); color: var(--c-accent); display: grid; place-items: center; }
.dropzone .hint { font-size: var(--fs-xs); color: var(--c-text-3); }
.files { list-style: none; margin: var(--sp-4) 0 0; padding: 0; display: grid; gap: var(--sp-2); }
.file { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3); border: 1px solid var(--c-border); border-radius: var(--radius-sm); }
.ficon { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--c-accent-tint); color: var(--c-accent); display: grid; place-items: center; flex: none; }
.file .fname { flex: 1; font-weight: 600; }
.file .fmeta { display: block; font-size: var(--fs-xs); color: var(--c-text-3); font-weight: 400; }

/* ── 요약 카드 */
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-4); }
@media (max-width: 760px) { .summary { grid-template-columns: 1fr; } }
.stat { padding: var(--sp-5); }
.stat-label { color: var(--c-text-2); font-size: var(--fs-sm); font-weight: 600; }
.stat-value { margin-top: var(--sp-1); font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
.stat-value small { margin-left: 2px; font-size: var(--fs-md); font-weight: 500; color: var(--c-text-2); }
.stat-value.ok { color: var(--c-ok); }
.stat-value.bad { color: var(--c-err); }
.stat-foot { margin-top: var(--sp-2); display: flex; gap: var(--sp-1); flex-wrap: wrap; align-items: center; color: var(--c-text-2); font-size: var(--fs-sm); }

/* ── 표 (지적 목록 · 출력 문서 · 이력) */
.table-wrap { border: 1px solid var(--c-border); border-radius: var(--radius-sm); overflow: auto; }
.data th, .data td { padding: 9px var(--sp-3); border-bottom: 1px solid var(--c-border); text-align: left; vertical-align: middle; }
.data thead th { position: sticky; top: 0; z-index: 1; background: var(--c-subtle); color: var(--c-text-2); font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; }
.data tbody th { background: var(--c-subtle); color: var(--c-text-2); font-weight: 600; white-space: nowrap; }
.data tbody tr:last-child td, .data tbody tr:last-child th { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.sum td { background: var(--c-subtle); font-weight: 700; }
#flags { margin-bottom: var(--sp-4); }
.flags-wrap { max-height: 340px; }
.flag-table tr.flag { cursor: pointer; }
.flag-table tr.flag:hover td { background: var(--c-subtle); }
.flag-table tr.sel td { background: var(--c-accent-tint); }
.flag-table tr.done td:not(.actions) { opacity: .55; }
.flag-table td.target { font-weight: 600; white-space: nowrap; }
.flag-table td.src { color: var(--c-text-2); font-size: var(--fs-sm); }
.flag-table .actions { text-align: right; white-space: nowrap; }
.ai-note { display: block; margin-top: 2px; color: var(--c-text-3); font-size: var(--fs-xs); }
tr.editor td { background: var(--c-subtle); cursor: default; }
.editor-box { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; }
.editor-box label { display: flex; align-items: center; gap: 6px; color: var(--c-text-2); }
.editor-box .err { color: var(--c-err); font-weight: 600; }

/* ── 원본 뷰어 · 출력 문서 */
.panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-4); }
@media (max-width: 1100px) { .panes { grid-template-columns: 1fr; } }
.tabs { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--c-muted-bg); border-radius: 10px; }
.tab { border: none; background: transparent; padding: 5px 12px; border-radius: 7px; color: var(--c-text-2); font-weight: 500; }
.tab.on { background: var(--c-surface); color: var(--c-text); font-weight: 700; box-shadow: 0 1px 2px rgba(16, 24, 40, .1); }
.viewer-bar { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border: 1px solid var(--c-border); border-bottom: none;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0; background: var(--c-surface); font-size: var(--fs-sm); }
.viewer-bar .ficon { width: 26px; height: 26px; }
.out-body { max-height: 64vh; overflow: auto; }
#right .data td, #right .data th { white-space: nowrap; }
.doc-note { margin-bottom: var(--sp-3); color: var(--c-text-2); font-size: var(--fs-sm); }
.hist-tools { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-3); }
.hist-tools label { display: flex; align-items: center; gap: 6px; color: var(--c-text-2); }

/* 강조 칸(노랑)과 바뀐 값(초록). 강조가 이깁니다. */
.chg { background: var(--c-chg) !important; }
.hl { background: var(--c-hl) !important; outline: 2px solid var(--c-hl-line); outline-offset: -2px; }

/* ── 원본 양식 3종: 문서 모양을 유지하고, 구조와 모양을 서로 다르게 */
/* ── 서류 뷰어: 연회색 바탕 위에 흰 종이를 올립니다 (원본 · 출력 공통) */
.viewer { max-height: 66vh; overflow: auto; padding: 28px 20px 36px; background: var(--c-paper-bg); border: 1px solid var(--c-border);
  border-radius: 0 0 var(--radius-sm) var(--radius-sm); }
.viewer.solo { border-radius: var(--radius-sm); }
.sheet { position: relative; isolation: isolate; max-width: 640px; margin: 0 auto 10px; }
.sheet.wide { max-width: none; }
/* 종이 뒤에 겹친 두 장 */
.sheet::before, .sheet::after { content: ''; position: absolute; inset: 0; background: #fff; border: 1px solid var(--c-paper-edge); border-radius: var(--radius-paper); }
.sheet::before { z-index: -1; transform: translate(5px, 5px); box-shadow: 0 2px 6px rgba(16, 24, 40, .08); }
.sheet::after { z-index: -2; transform: translate(10px, 10px); background: #f6f7f9; box-shadow: 0 3px 10px rgba(16, 24, 40, .10); }
.sheet-lift { position: relative; transition: transform .18s ease; }
.sheet-label { position: absolute; top: -11px; left: 20px; z-index: 1; padding: 2px 10px; border-radius: var(--radius-pill); background: var(--c-text-2);
  color: #fff; font-size: var(--fs-xs); font-weight: 700; letter-spacing: .04em; box-shadow: 0 1px 3px rgba(16, 24, 40, .2); }
.sheet-label.out { background: var(--c-accent); }
.sheet:hover .sheet-lift { transform: translateY(-3px); }
.sheet:hover .paper { box-shadow: var(--shadow-paper-hover); }
@media (prefers-reduced-motion: reduce) { .sheet-lift, .paper { transition: none; } .sheet:hover .sheet-lift { transform: none; } }
@media (max-width: 640px) { .viewer { padding: 24px 14px 30px; } .paper { padding: 28px 16px 20px; } }

/* 종이: 글자는 진하고 크게. 표가 넓으면 종이 안에서 옆으로 스크롤되고, 종이 자체는 잘리지 않습니다. */
.paper { position: relative; overflow-x: auto; padding: 32px 22px 26px; background: #fff; border: 1px solid var(--c-paper-edge); border-radius: var(--radius-paper);
  box-shadow: var(--shadow-paper); color: var(--c-paper-text); font-size: var(--fs-paper); word-break: keep-all; transition: box-shadow .18s ease; }
.paper h3 { font-size: 20px; font-weight: 800; margin-bottom: var(--sp-4); }
.paper table th, .paper table td { padding: 8px 9px; border-bottom: 1px solid #e3e7ec; text-align: left; }
.paper table th { font-size: 13px; font-weight: 700; color: #344054; }
.paper .hl { box-shadow: 0 0 0 3px rgba(201, 138, 0, .18); }
.out-doc h3 { margin-bottom: var(--sp-2); }
.out-doc .table-wrap { border-color: #e3e7ec; }
.paper table .num { text-align: right; }
.paper p { margin-top: var(--sp-3); }
.paper .virtual { margin-top: var(--sp-4); color: var(--c-text-3); font-size: var(--fs-xs); }
.mock { position: absolute; top: 16px; right: 18px; padding: 0 8px; border: 2px solid #d92d20; border-radius: 4px; color: #d92d20;
  font-size: var(--fs-sm); font-weight: 800; letter-spacing: .1em; transform: rotate(8deg); opacity: .85; }
.form-card h3 { color: #2453a6; padding-bottom: var(--sp-2); border-bottom: 2px solid #2453a6; }
.form-card .meta { display: flex; gap: var(--sp-5); flex-wrap: wrap; margin-bottom: var(--sp-3); }
.form-card .meta .k { color: var(--c-text-3); margin-right: 4px; }
.form-card .meta span[id] { padding: 1px 3px; }
.form-card thead th { background: #eef3fb; color: #1d3b73; }
.form-bank h3 { text-align: center; letter-spacing: .4em; }
.form-bank table.kv-doc { width: auto; margin-bottom: var(--sp-3); }
.form-bank table.kv-doc th { color: #374151; padding-right: var(--sp-5); }
.form-bank table.grid th, .form-bank table.grid td { border: 1px solid #9aa3af; }
.form-bank table.grid thead th { background: #f3f4f6; }
.form-health .org { display: inline-block; padding: 1px 3px; color: #1f7a4d; font-weight: 700; }
.form-health h3 { margin-top: var(--sp-2); }
.form-health .boxes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); margin-bottom: var(--sp-3); }
.form-health .box { padding: 6px 10px; border: 1px solid #c4e3d1; border-radius: 4px; }
.form-health .box b { display: block; font-size: var(--fs-xs); color: #1f7a4d; }
.form-health thead th { background: #eaf6ef; color: #22573a; }
.form-health .due { display: inline-block; margin-top: var(--sp-3); padding: 6px 10px; border: 1px dashed #1f7a4d; border-radius: 4px; }

/* ── 개발자 확인: 프로토 자체 검사 (대조 화면 맨 아래, 기본은 접힘) */
.devcheck { margin-top: var(--sp-8); padding-top: var(--sp-4); border-top: 1px solid var(--c-border); }
.dev-link { padding: 0; border: none; background: none; color: var(--c-text-3); font-size: var(--fs-xs); font-weight: 400;
  text-decoration: underline; text-underline-offset: 2px; }
.dev-link:hover:not(:disabled) { background: none; color: var(--c-text-2); }
.dev-panel { max-width: 640px; margin-top: var(--sp-3); padding: var(--sp-3) var(--sp-4); background: var(--c-surface);
  border: 1px dashed var(--c-border-strong); border-radius: var(--radius-sm); color: var(--c-text-2); font-size: var(--fs-sm); }
.dev-panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-1); }
.dev-panel .mark { display: inline-block; width: 18px; font-weight: 700; }
.dev-sum { margin-top: var(--sp-3); padding-top: var(--sp-2); border-top: 1px solid var(--c-border); font-weight: 700; }
.dev-panel .ok { color: var(--c-ok); }
.dev-panel .bad { color: var(--c-err); }
</style>
</head>
<body>
<header class="appbar" id="appbar"></header>
<main class="page">

function extract(forms) {

// verify 안에서 쓰는 원본 재추출. P1에서는 AI가 원본만 다시 읽습니다 (출력 값은 보여 주지 않음).
// P0에서는 목업 원본 JSON(정답 값)을 매핑 규칙으로 읽습니다.
function rereadSource(forms) {
  const out = [];
  for (const { id } of CLAIMS) {
    const [formId, map] = SOURCE_MAP[id];
    for (const f of FIELDS) {
      const m = map[f];
      if (m === null) out.push({ 채권ID: id, 필드: f, 값: null, 원본: null });
      else if (typeof m === 'string') out.push({ 채권ID: id, 필드: f, 값: forms[formId].cells[m], 원본: { 양식ID: formId, 칸ID: m } });
      else out.push({ 채권ID: id, 필드: f, 값: m.value, 원본: m.cell ? { 양식ID: formId, 칸ID: m.cell } : null });
    }
  }
  return out;
}

// ── 4. 출력 문서 3종: 채권자목록 → 변제계획 채권액 → 개시신청서
function groupOf(row) { return row.우선권여부 ? '우선권' : '일반'; }

function buildDocs(extraction) {
  const rows = {};
  for (const { id } of CLAIMS) rows[id] = {};
  for (const it of extraction) rows[it.채권ID][it.필드] = it.값;
  const docs = { list: { rows, sums: {} }, plan: { rows: {}, sums: {} }, app: { rows: {}, sums: {} } };
  propagate(docs);
  return docs;
}

// 채권자목록 행 값을 기준으로 총 채권액, 합계, 변제계획, 개시신청서를 다시 채웁니다.
// 총 채권액 = 원금 + 이자. 연회비(참고)는 합계에 더하지 않습니다.
function propagate(docs) {
  const L = docs.list;
  const sums = {};
  for (const g of GROUPS) sums[g] = { 원금: 0, 이자: 0, 총채권액: 0 };
  for (const { id } of CLAIMS) {
    const r = L.rows[id];
    r.총채권액 = r.원금 + r.이자;
    for (const g of [groupOf(r), '총합계']) for (const k of LIST_SUM_COLS) sums[g][k] += r[k];
    docs.plan.rows[id] = { 채권자명: r.채권자명, 구분: groupOf(r), 채권액: r.총채권액 };
  }
  L.sums = sums;
  for (const g of GROUPS) {
    docs.plan.sums[g] = { 채권액: sums[g].총채권액 };
    docs.app.sums[g] = { 채권액: sums[g].총채권액 };
  }
}

// ── 5. verify(원본, 출력 문서) → 지적 목록
function verify(forms, docs) {
  const flags = [];
  const truth = rereadSource(forms);
  const T = {};
  for (const it of truth) (T[it.채권ID] ??= {})[it.필드] = it;
  const L = docs.list;
  const claimSrc = id => [T[id].원금.원본, T[id].이자.원본].filter(Boolean);

  // 5-1. 작성 오류 + 연회비 규칙: 원본 다시 읽은 값 ↔ 출력 값. null 필드는 비교하지 않습니다.
  for (const it of truth) {
    if (it.값 === null) continue;
    const c = it.채권ID, f = it.필드, actual = L.rows[c][f];
    const base = { claim: c, field: f, out: { doc: 'list', kind: 'rows', row: c, col: f }, actual,
                   title: `${claimLabel(c)} · ${f}` };
    const src = it.원본 ? [it.원본] : [];
    const fee = f === '이자' ? T[c].연회비 : null;
    if (fee && fee.값 > 0) {
      // 이자 기대값은 {원본 이자, 원본 이자 + 연회비} 둘 다 허용합니다.
      const withFee = it.값 + fee.값;
      if (actual === it.값) {
        flags.push({ ...base, key: `연회비:${c}`, kind: '연회비', grade: '확인 필요', expected: withFee,
          accept: [withFee, it.값], src: [...src, fee.원본],
          msg: `원본에 연회비 ${fmt(fee.값)}원이 있는데 출력 이자에 빠졌습니다. 포함하면 ${fmt(withFee)}원입니다.` });
      } else if (actual !== withFee) {
        flags.push({ ...base, key: `작성:${c}:${f}`, kind: '작성', grade: '오류', expected: it.값,
          accept: [it.값, withFee], src: [...src, fee.원본],
          msg: `출력 ${fmt(actual)} ≠ 원본 ${fmt(it.값)} (연회비 포함 시 ${fmt(withFee)})` });
      }
      continue;
    }
    if (actual !== it.값) {
      flags.push({ ...base, key: `작성:${c}:${f}`, kind: '작성', grade: '오류', expected: it.값,
        accept: [it.값], src, msg: `출력 ${fmt(actual)} ≠ 원본 ${fmt(it.값)}` });
    }
  }

  // 5-2. 문서 간 동일 값: 채권자목록 → 변제계획 → 개시신청서
  for (const { id } of CLAIMS) {
    const a = L.rows[id].총채권액, b = docs.plan.rows[id].채권액;
    if (a !== b) flags.push({ key: `문서간:plan:${id}`, kind: '문서간', grade: '오류',
      out: { doc: 'plan', kind: 'rows', row: id, col: '채권액' }, actual: b, expected: a, accept: [a],
      src: claimSrc(id), title: `${claimLabel(id)} · 채권액 (변제계획)`,
      msg: `변제계획 ${fmt(b)} ≠ 채권자목록 ${fmt(a)}` });
  }
  for (const g of GROUPS) {
    const a = L.sums[g].총채권액;
    for (const d of ['plan', 'app']) {
      const b = docs[d].sums[g].채권액;
      if (a !== b) flags.push({ key: `문서간:${d}:${g}`, kind: '문서간', grade: '오류',
        out: { doc: d, kind: 'sums', row: g, col: '채권액' }, actual: b, expected: a, accept: [a], src: [],
        title: `${DOC_NAME[d]} · ${g} 채권액`, msg: `${DOC_NAME[d]} ${fmt(b)} ≠ 채권자목록 ${fmt(a)}` });
    }
  }

  // 5-3. 합계 재계산: 일반·우선권·총합계가 항목 합과 같은지
  const calc = {}, planCalc = {};
  for (const g of GROUPS) { calc[g] = { 원금: 0, 이자: 0, 총채권액: 0 }; planCalc[g] = 0; }
  for (const { id } of CLAIMS) {
    const r = L.rows[id];
    const exp = r.원금 + r.이자;
    if (r.총채권액 !== exp) flags.push({ key: `합계:list:${id}:총채권액`, kind: '합계', grade: '오류',
      out: { doc: 'list', kind: 'rows', row: id, col: '총채권액' }, actual: r.총채권액, expected: exp, accept: [exp],
      src: claimSrc(id), title: `${claimLabel(id)} · 총 채권액`, msg: `기재 ${fmt(r.총채권액)} ≠ 원금+이자 ${fmt(exp)}` });
    for (const g of [groupOf(r), '총합계']) for (const k of LIST_SUM_COLS) calc[g][k] += r[k];
    const p = docs.plan.rows[id];
    for (const g of [p.구분, '총합계']) planCalc[g] += p.채권액;
  }
  for (const g of GROUPS) {
    for (const k of LIST_SUM_COLS) {
      const a = L.sums[g][k], e = calc[g][k];
      if (a !== e) flags.push({ key: `합계:list:${g}:${k}`, kind: '합계', grade: '오류',
        out: { doc: 'list', kind: 'sums', row: g, col: k }, actual: a, expected: e, accept: [e], src: [],
        title: `채권자목록 · ${g} 합계 ${colLabel(k)}`, msg: `기재 ${fmt(a)} ≠ 항목 합 ${fmt(e)}` });
    }
    const a = docs.plan.sums[g].채권액;
    if (a !== planCalc[g]) flags.push({ key: `합계:plan:${g}:채권액`, kind: '합계', grade: '오류',
      out: { doc: 'plan', kind: 'sums', row: g, col: '채권액' }, actual: a, expected: planCalc[g], accept: [planCalc[g]],
      src: [], title: `변제계획 · ${g} 합계`, msg: `기재 ${fmt(a)} ≠ 항목 합 ${fmt(planCalc[g])}` });
  }
  return flags;
}

// ── 6. 이력: 추가만 됩니다. 수정·삭제 함수는 없고, 항목은 freeze합니다.
function createHistory() {
  const entries = [];
  return {
    append(e) {
      const frozen = Object.freeze({ ...e, 원본위치: Object.freeze([...e.원본위치]) });
      entries.push(frozen);
      return frozen;
    },
    list() { return entries.slice(); },
  };
}

// ── 7. 검사 테스트 (페이지 안에서 실행)
function normalDocs() {
  // 정상 문서: 원본 그대로 채우고, 연회비까지 이자에 반영한 상태
  const d = buildDocs(rereadSource(FORMS));
  d.list.rows.C1.이자 += d.list.rows.C1.연회비;
  propagate(d);
  return d;
}
const TESTS = [
  { name: '① 개시신청서 총합계에 예전 값 → 문서 간 불일치 지적', run() {
    const d = normalDocs();
    d.app.sums.총합계.채권액 -= d.list.rows.H1.총채권액;
    return verify(FORMS, d).some(f => f.kind === '문서간' && f.out.doc === 'app' && f.out.row === '총합계');
  } },
  { name: '② 채권자목록 합계 ≠ 항목 합 → 합계 오류 지적', run() {
    const d = normalDocs();
    d.list.sums.총합계.원금 += 10000;
    return verify(FORMS, d).some(f => f.kind === '합계' && f.out.doc === 'list' && f.out.row === '총합계');
  } },
  { name: '③ 우선권 채권이 일반 합계에 섞임 → 우선권 합계 불일치 지적', run() {
    const d = normalDocs();
    const h = d.list.rows.H1;
    for (const k of LIST_SUM_COLS) { d.list.sums.일반[k] += h[k]; d.list.sums.우선권[k] = 0; }
    return verify(FORMS, d).some(f => f.kind === '합계' && f.out.doc === 'list' && f.out.row === '우선권');
  } },
  { name: '④ 정상 문서 → 지적 0건', run() {
    return verify(FORMS, normalDocs()).length === 0;
  } },
  { name: '⑤ 문서 간·합계 지적 → 수정 승인만 허용 (현행 유지 불가)', run() {
    const d = normalDocs();
    d.app.sums.총합계.채권액 -= d.list.rows.H1.총채권액;
    d.list.sums.총합계.원금 += 10000;
    const calc = verify(FORMS, d).filter(f => f.kind === '문서간' || f.kind === '합계');
    const write = verify(FORMS, buildDocs(extract(FORMS)));
    return calc.length > 0 && calc.every(f => allowedActions(f).join() === '수정 승인')
      && write.length > 0 && write.every(f => allowedActions(f).includes('현행 유지'));
  } },
];
function runTests() {
  return TESTS.map(t => {
    let ok = false;
    try { ok = t.run() === true; } catch (e) { console.error(t.name, e); }
    return { name: t.name, ok };
  });
}

// ── 8. 표시 도우미
function fmt(v) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'boolean') return v ? '우선권' : '일반';
  if (typeof v === 'number') return v.toLocaleString('ko-KR');
  return String(v);
}
function fmtSrc(v) {
  if (typeof v === 'number') return v.toLocaleString('ko-KR');
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v.replaceAll('-', '.');
  return String(v);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function claimLabel(id) { return CLAIMS.find(c => c.id === id).label; }
function colLabel(k) { return COL_LABEL[k] || k; }
function srcLabel(s) { return `${FORMS[s.양식ID].이름} · ${CELL_LABEL[s.양식ID][s.칸ID]}`; }
function srcId(s) { return `s-${s.양식ID}-${s.칸ID}`; }
function outId(o) { return `o-${o.doc}-${o.row}-${o.col}`; }
function getOut(docs, o) { return docs[o.doc][o.kind][o.row][o.col]; }
function setOut(docs, o, v) { docs[o.doc][o.kind][o.row][o.col] = v; }

function parseValue(col, raw) {
  const s = String(raw).trim();
  if (AMOUNT_COLS.has(col)) {
    const t = s.replace(/[,\s원]/g, '');
    return /^\d+$/.test(t) ? Number(t) : undefined;
  }
  if (DATE_COLS.has(col)) {
    const t = s.replace(/[./]/g, '-');
    return /^\d{4}-\d{2}-\d{2}$/.test(t) ? t : undefined;
  }
  if (col === '우선권여부') return s === '우선권' ? true : s === '일반' ? false : undefined;
  return s ? s : undefined;
}

function snapshot(docs) {
  const m = {};
  for (const d of ['list', 'plan', 'app']) for (const kind of ['rows', 'sums']) {
    const t = docs[d][kind];
    for (const row in t) for (const col in t[row]) m[`o-${d}-${row}-${col}`] = t[row][col];
  }
  return m;
}

// ── 9. 화면 상태와 처리
let state;

function initialState(processor) {
  const extraction = extract(FORMS);
  return {
    extraction,
    docs: buildDocs(extraction),
    resolved: {},          // 지적 key → { value: 처리 시점 값, action, flag }
    history: createHistory(),
    processor: processor || '사무직원',
    leftTab: 'card', rightTab: 'list',
    selectedKey: null,
    editing: null, draft: { value: '', reason: '' }, editError: '',
    changed: {},           // 출력 칸 id → 강조 끝 시각
    histFilter: '',
    flags: [],
  };
}

function reverify() {
  state.flags = verify(FORMS, state.docs);
  // 처리 시점 값과 지금 값이 다르면, 처리 기록을 지우고 지적을 새로 엽니다.
  for (const f of state.flags) {
    const r = state.resolved[f.key];
    if (r && getOut(state.docs, f.out) !== r.value) delete state.resolved[f.key];
  }
}

function flagView() {
  const found = new Set(state.flags.map(f => f.key));
  const view = state.flags.map(f => state.resolved[f.key]
    ? { flag: f, status: '처리됨', res: state.resolved[f.key] }
    : { flag: f, status: '열림' });
  for (const [k, r] of Object.entries(state.resolved)) {
    if (!found.has(k) && getOut(state.docs, r.flag.out) === r.value) view.push({ flag: r.flag, status: '처리됨', res: r });
  }
  const order = id => { const i = CLAIMS.findIndex(c => c.id === id); return i < 0 ? 99 : i; };
  return view.sort((a, b) => (a.status === b.status ? 0 : a.status === '열림' ? -1 : 1)
    || order(a.flag.out.row) - order(b.flag.out.row));
}

// 문서 간·합계 지적은 계산값이 문서마다 다른 채로 남으면 안 되므로 수정 승인만 허용합니다.
function allowedActions(flag) {
  return flag.kind === '문서간' || flag.kind === '합계' ? ['수정 승인'] : ['수정 승인', '현행 유지'];
}

function applyResolution(flag, action, value, reason) {
  if (!allowedActions(flag).includes(action)) return false;
  const before = getOut(state.docs, flag.out);
  const snapBefore = snapshot(state.docs);
  if (action === '수정 승인') {
    if (flag.kind === '작성' || flag.kind === '연회비') setOut(state.docs, flag.out, value);
    propagate(state.docs);   // 연관 문서 반영 + 합계 재계산
  }
  const after = getOut(state.docs, flag.out);
  const snapAfter = snapshot(state.docs);
  const changedIds = Object.keys(snapAfter).filter(id => snapAfter[id] !== snapBefore[id]);
  const changedDocs = [...new Set(changedIds.map(id => DOC_NAME[id.split('-')[1]]))];

  state.resolved[flag.key] = { value: after, action, flag };
  state.history.append({
    시각: new Date().toLocaleString('ko-KR'),
    처리자: state.processor,
    문서: DOC_NAME[flag.out.doc],
    필드: flag.title,
    필드키: outId(flag.out),
    변경전: before, 변경후: after,
    원본위치: flag.src.map(srcLabel),
    구분: action,
    사유: reason,
    반영문서: changedDocs.join(', ') || '—',
  });

  const until = Date.now() + 4000;
  for (const id of changedIds) state.changed[id] = until;
  setTimeout(clearChanged, 4100);
  reverify();
  return true;
}

function clearChanged() {
  const now = Date.now();
  for (const [id, t] of Object.entries(state.changed)) {
    if (t <= now) { delete state.changed[id]; document.getElementById(id)?.classList.remove('chg'); }
  }
}

function confirmEdit() {
  const { key, action } = state.editing;
  const f = state.view.find(v => v.flag.key === key).flag;
  let value = getOut(state.docs, f.out);
  if (action === '수정 승인') {
    if (f.kind === '작성' || f.kind === '연회비') {
      value = parseValue(f.out.col, state.draft.value);
      if (value === undefined) { state.editError = '값 형식이 맞지 않습니다.'; return render(); }
    } else {
      value = f.expected;
    }
  }
  const reason = state.draft.reason.trim();
  const needReason = action === '현행 유지' || !f.accept.includes(value);
  if (needReason && !reason) {
    state.editError = action === '현행 유지' ? '현행 유지는 사유가 필수입니다.' : '원본과 다른 값으로 바꿀 때는 사유가 필수입니다.';
    return render();
  }
  applyResolution(f, action, value, reason);
  state.editing = null;
  state.editError = '';
  render();
}

function selectFlag(key, scroll) {
  state.selectedKey = key;
  const v = state.view.find(x => x.flag.key === key);
  if (v) {
    if (v.flag.src.length) state.leftTab = v.flag.src[0].양식ID;
    state.rightTab = v.flag.out.doc;
  }
  render();
  if (scroll) {
    for (const pane of ['#left', '#right']) {
      document.querySelector(`${pane} .hl`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }
}

// ── 10. 그리기. 화면 모듈: 앱 바 · 초입 화면 · 요약 카드 · 지적 목록 · 원본 뷰어 · 출력 문서 · 이력
// 화면 위치는 state 밖에 둡니다. 초기화해도 지금 화면에 머뭅니다.
const ui = { screen: 'intake', started: false, devOpen: false };

let ctx = { hl: new Set(), now: 0 };
function cls(id, extra = '') {
  const c = [extra];
  if (ctx.hl.has(id)) c.push('hl');
  if (state.changed[id] > ctx.now) c.push('chg');
  return c.filter(Boolean).join(' ');
}
const $ = sel => document.querySelector(sel);

function render() {
  state.view = flagView();
  const sel = state.view.find(v => v.flag.key === state.selectedKey);
  ctx = { hl: new Set(), now: Date.now() };
  if (sel) { sel.flag.src.forEach(s => ctx.hl.add(srcId(s))); ctx.hl.add(outId(sel.flag.out)); }
  $('#appbar').innerHTML = renderAppBar();
  $('#intake').hidden = ui.screen !== 'intake';
  $('#review').hidden = ui.screen !== 'review';
  if (ui.screen === 'intake') { $('#intake').innerHTML = renderIntake(); return; }
  $('#review-head').innerHTML = renderReviewHead();
  $('#summary').innerHTML = renderSummary(state.view);
  $('#flags').innerHTML = renderFlags(state.view);
  $('#left').innerHTML = renderSourceViewer();
  $('#right').innerHTML = renderOutput();
  $('#devcheck').innerHTML = renderDevCheck();
}

// 10-2. 앱 바
const STEPS = [[1, '서류 업로드'], [2, '작성'], [3, '검토'], [4, '이력']];

    <div class="intake-grid">
      <section class="card">${cardInner('고객 정보', '가상 고객입니다.', customer)}</section>
      <section class="card">${cardInner('서류 업로드', `올라간 서류 ${SAMPLE_UPLOADS.length}건`, upload, startButton)}</section>
    </div>
  </div>`;
}

// 10-4. 대조 화면 머리와 요약 카드
function renderReviewHead() {
  return `<button class="ghost" data-act="intake">← 서류 업로드</button>
    <div class="titles"><h1>검토</h1><p class="desc">${esc(DEBTOR)} · 서류 기준일 ${esc(fmtSrc(BASE_DATE))} · 원본 ${SAMPLE_UPLOADS.length}종</p></div>
    ${chip('프로토: 샘플 서류 · mock AI', 'chip-info')}`;
}

function renderSummary(view) {
  const open = view.filter(v => v.status === '열림'), done = view.filter(v => v.status === '처리됨');
  const count = (arr, fn) => arr.filter(fn).length;
  const D = state.docs;
  // 표시용: 채권자목록 · 변제계획 · 개시신청서의 일반·우선권·총합계가 모두 같은지
  const match = GROUPS.every(g => D.plan.sums[g].채권액 === D.list.sums[g].총채권액 && D.app.sums[g].채권액 === D.list.sums[g].총채권액);
  const stat = (label, value, foot, tone = '') => `<section class="card stat"><p class="stat-label">${label}</p>
    <div class="stat-value ${tone}">${value}</div><div class="stat-foot">${foot}</div></section>`;
  return stat('열린 지적', `${open.length}<small>건</small>`,
      `${chip(`오류 ${count(open, v => v.flag.grade === '오류')}`, 'chip-err')} ${chip(`확인 필요 ${count(open, v => v.flag.grade === '확인 필요')}`, 'chip-warn')}`)
    + stat('처리됨', `${done.length}<small>건</small>`,
      `${chip(`수정 승인 ${count(done, v => v.res.action === '수정 승인')}`, 'chip-approve')} ${chip(`현행 유지 ${count(done, v => v.res.action === '현행 유지')}`, 'chip-keep')}`)
    + stat('문서 합계', match ? '일치' : '불일치',
      `채권자목록 · 변제계획 · 개시신청서 · 총 채권액 ${esc(fmt(D.list.sums.총합계.총채권액))}원`, match ? 'ok' : 'bad');
}

// 10-5. 지적 목록
function renderFlags(view) {
  let body = '<p class="empty">지적이 없습니다.</p>';
  if (view.length) {
    let h = `<div class="table-wrap flags-wrap"><table class="data flag-table"><thead><tr><th>등급</th><th>대상</th><th>내용</th><th>원본 위치</th><th class="actions">상태 · 처리</th></tr></thead><tbody>`;
    for (const v of view) {
      const f = v.flag, done = v.status === '처리됨', k = esc(f.key);
      h += `<tr class="flag ${done ? 'done' : ''} ${f.key === state.selectedKey ? 'sel' : ''}" data-act="select" data-key="${k}">
        <td>${chip(f.grade, GRADE_CHIP[f.grade])}</td>
        <td class="target">${esc(f.title)}</td>
        <td>${esc(f.msg)}${aiNote(f)}</td>
        <td class="src">${esc(f.src.map(srcLabel).join(' + ') || '—')}</td>
        <td class="actions">${done
          ? `${chip('처리됨', 'chip-done')} ${chip(v.res.action, ACTION_CHIP[v.res.action])}`
          : allowedActions(f).map(a => `<button class="sm ${a === '수정 승인' ? 'primary' : ''}" data-act="edit" data-action="${a}" data-key="${k}">${a}</button>`).join(' ')}</td></tr>`;
      if (!done && state.editing && state.editing.key === f.key) h += renderEditor(f);
    }
    body = h + '</tbody></table></div>';
  }
  return cardInner('지적 목록', '지적을 누르면 원본 칸과 출력 칸이 함께 강조됩니다.', body);
}

function aiNote(f) {
  if (f.kind !== '작성' || !f.src.length) return '';
  const it = state.extraction.find(x => x.채권ID === f.claim && x.필드 === f.field);
  if (!it || !it.원본 || it.원본.칸ID === f.src[0].칸ID) return '';
  return `<span class="ai-note">AI 추출 위치: ${esc(srcLabel(it.원본))}</span>`;
}

function renderEditor(f) {
  const a = state.editing.action;
  const editable = f.kind === '작성' || f.kind === '연회비';
  let valuePart;
  if (a === '현행 유지') valuePart = `<span>값은 그대로 둡니다: <b>${esc(fmt(getOut(state.docs, f.out)))}</b></span>`;
  else if (editable) valuePart = `<label>바꿀 값 <input data-draft="value" value="${esc(state.draft.value)}" size="14"></label>
    <span class="muted">기본값 = 원본 값</span>`;
  else valuePart = `<span>재계산 값 <b>${esc(fmt(f.expected))}</b>으로 반영합니다.</span>`;
  const reasonLabel = a === '현행 유지' ? '사유 (필수)' : '사유 (원본과 다른 값이면 필수)';
  return `<tr class="editor" data-act="noop"><td colspan="5"><div class="editor-box">
    ${chip(a, ACTION_CHIP[a])} ${valuePart}
    <label>${reasonLabel} <input data-draft="reason" value="${esc(state.draft.reason)}" size="28"></label>
    <button class="sm primary" data-act="confirm">확인</button>
    <button class="sm ghost" data-act="cancel">취소</button>
    <span class="err">${esc(state.editError)}</span>
  </div></td></tr>`;
}

// 10-6. 원본 뷰어: 문서 뷰어 프레임 안에 원본 양식을 그립니다.
const SOURCE_TABS = [['card', '한빛카드'], ['bank', '새봄은행'], ['health', '건강보험료']];

function renderSourceViewer() {
  const id = state.leftTab;
  const doc = { card: renderCard, bank: renderBank, health: renderHealth }[id]();
  const bar = `<div class="viewer-bar"><span class="ficon">${ICON.file}</span><b>${esc(FORMS[id].이름)}</b>${chip('목업 원본', 'chip-info')}</div>`;
  return cardInner('원본 서류', '증명서 원본입니다. 지적한 칸이 노랗게 강조됩니다.',
    `${bar}<div class="viewer">${sheet('원본', 'src', doc)}</div>`, tabs('ltab', SOURCE_TABS, id));
}

// 종이 한 장: 뒤에 겹친 종이, 위쪽 라벨("원본"/"출력"), 마우스를 올리면 살짝 떠오름
function sheet(label, kind, paper, extra = '') {
  return `<div class="sheet ${extra}"><div class="sheet-lift"><span class="sheet-label ${kind}">${label}</span>${paper}</div></div>`;
}

// 원본 칸: 칸ID로 강조할 수 있게 id를 붙입니다.
function sc(formId, cellId, tag = 'td', extra = '') {
  const id = `s-${formId}-${cellId}`;
  return `<${tag} id="${id}" class="${cls(id, extra)}">${esc(fmtSrc(FORMS[formId].cells[cellId]))}</${tag}>`;
}
const VIRTUAL = '<p class="virtual">가상 문서입니다. 실존 기관·금융사와 관계없습니다.</p>';

function renderCard() {
  const F = 'card', c = FORMS.card.cells;
  const row = r => `<tr>${sc(F, `${r}_kind`)}${sc(F, `${r}_date`)}${sc(F, `${r}_principal`, 'td', 'num')}
    ${sc(F, `${r}_interest`, 'td', 'num')}${sc(F, `${r}_fee`, 'td', 'num')}${sc(F, `${r}_total`, 'td', 'num')}</tr>`;
  return `<div class="paper form-card"><div class="mock">목업</div>
    ${sc(F, 'title', 'h3')}
    <div class="meta"><div><span class="k">발급사</span>${sc(F, 'issuer', 'span')}</div><div><span class="k">채무자</span>${esc(c.debtor)}</div><div><span class="k">기준일</span>${sc(F, 'base', 'span')}</div></div>
    <table><thead><tr><th>구분</th><th>이용(대출)일</th><th class="num">원금</th><th class="num">이자</th><th class="num">연회비</th><th class="num">합계</th></tr></thead>
    <tbody>${row('r1')}${row('r2')}
    <tr class="sum"><td colspan="5">합계</td>${sc(F, 'sum_total', 'td', 'num')}</tr></tbody></table>
    ${VIRTUAL}</div>`;
}

function renderBank() {
  const F = 'bank', c = FORMS.bank.cells;
  const row = r => `<tr><td>${esc(c[`${r}_acct`])}</td>${sc(F, `${r}_product`)}${sc(F, `${r}_open`)}${sc(F, `${r}_maturity`)}
    ${sc(F, `${r}_principal`, 'td', 'num')}${sc(F, `${r}_interest`, 'td', 'num')}</tr>`;
  return `<div class="paper form-bank"><div class="mock">목업</div>
    ${sc(F, 'title', 'h3')}
    <table class="kv-doc"><tr><th>은행명</th>${sc(F, 'issuer')}</tr><tr><th>고객명</th><td>${esc(c.debtor)}</td></tr><tr><th>기준일</th>${sc(F, 'base')}</tr></table>
    <table class="grid"><thead><tr><th>계좌번호</th><th>상품명</th><th>신규일자</th><th>만기일</th><th class="num">대출잔액</th><th class="num">미수이자</th></tr></thead>
    <tbody>${row('r1')}${row('r2')}
    <tr class="sum"><td colspan="4">합계</td><td class="num">${fmtSrc(c.sum_principal)}</td><td class="num">${fmtSrc(c.sum_interest)}</td></tr></tbody></table>
    <p>위와 같이 부채 잔액을 증명합니다.</p>${VIRTUAL}</div>`;
}

function renderHealth() {
  const F = 'health', c = FORMS.health.cells;
  return `<div class="paper form-health"><div class="mock">목업</div>
    ${sc(F, 'issuer', 'span', 'org')}
    ${sc(F, 'title', 'h3')}
    <div class="boxes">
      <div class="box"><b>납부자</b>${esc(c.debtor)}</div>
      <div class="box"><b>기준일</b>${sc(F, 'base', 'span')}</div>
      <div class="box"><b>구분</b>${sc(F, 'kind', 'span')}</div>
      <div class="box"><b>체납기간</b>${esc(c.period)}</div>
    </div>
    <table><thead><tr><th class="num">보험료</th><th class="num">연체금</th><th class="num">미납액 계</th></tr></thead>
    <tbody><tr>${sc(F, 'premium', 'td', 'num')}${sc(F, 'late', 'td', 'num')}${sc(F, 'total', 'td', 'num')}</tr></tbody></table>
    <div class="due">최초 미납분 납부기한: ${sc(F, 'firstDue', 'span')}</div>
    ${VIRTUAL}</div>`;
}

// 10-7. 출력 문서: 채권자목록 · 변제계획 · 개시신청서 · 이력
const OUTPUT_TABS = [['list', '채권자목록'], ['plan', '변제계획'], ['app', '개시신청서'], ['history', '이력']];

function renderOutput() {
  const tab = state.rightTab;
  const body = { list: renderList, plan: renderPlan, app: renderApp, history: renderHistory }[tab]();
  // 이력은 서류가 아니라서 종이에 올리지 않습니다.
  const content = tab === 'history'
    ? `<div class="out-body">${body}</div>`
    : `<div class="viewer solo">${sheet('출력', 'out', `<div class="paper out-doc"><h3>${DOC_NAME[tab]}</h3>${body}</div>`, tab === 'list' ? 'wide' : '')}</div>`;
  return cardInner('출력 문서', '원본에서 자동 작성한 문서입니다. 바뀐 값은 잠시 초록색으로 보입니다.',
    content, tabs('rtab', OUTPUT_TABS, tab));
}

// 출력 칸: (문서, 채권ID 또는 합계 구분, 필드) 고정 규칙으로 id를 정합니다.
function oc(doc, kind, row, col, extra = '') {
  const id = outId({ doc, row, col });
  return `<td id="${id}" class="${cls(id, extra)}">${esc(fmt(state.docs[doc][kind][row][col]))}</td>`;
}

function renderList() {
  const d = 'list';
  let h = `<div class="table-wrap"><table class="data"><thead><tr><th>번호</th><th>채권자명</th><th>채권종류</th><th>발생일</th><th class="num">원금</th><th class="num">이자</th>
    <th class="num">연회비(참고) ${chip('프로토 전용', 'chip-info')}</th><th class="num">총 채권액</th><th>구분</th><th>기준일</th></tr></thead><tbody>`;
  CLAIMS.forEach(({ id }, i) => {
    h += `<tr><td>${i + 1}</td>${oc(d, 'rows', id, '채권자명')}${oc(d, 'rows', id, '채권종류')}${oc(d, 'rows', id, '발생일')}
      ${oc(d, 'rows', id, '원금', 'num')}${oc(d, 'rows', id, '이자', 'num')}${oc(d, 'rows', id, '연회비', 'num')}
      ${oc(d, 'rows', id, '총채권액', 'num')}${oc(d, 'rows', id, '우선권여부')}${oc(d, 'rows', id, '기준일')}</tr>`;
  });
  for (const g of GROUPS) {
    h += `<tr class="sum"><td colspan="4">${g === '총합계' ? '총합계' : `${g} 채권 합계`}</td>
      ${oc(d, 'sums', g, '원금', 'num')}${oc(d, 'sums', g, '이자', 'num')}<td></td>${oc(d, 'sums', g, '총채권액', 'num')}<td colspan="2"></td></tr>`;
  }
  return `<p class="doc-note">총 채권액 = 원금 + 이자. 연회비(참고)는 합계에 더하지 않습니다.</p>${h}</tbody></table></div>`;
}

function renderPlan() {
  const d = 'plan';
  let h = `<div class="table-wrap"><table class="data"><thead><tr><th>채권자명</th><th>구분</th><th class="num">채권액</th></tr></thead><tbody>`;
  for (const { id } of CLAIMS) h += `<tr>${oc(d, 'rows', id, '채권자명')}${oc(d, 'rows', id, '구분')}${oc(d, 'rows', id, '채권액', 'num')}</tr>`;
  for (const g of GROUPS) h += `<tr class="sum"><td colspan="2">${g === '총합계' ? '총합계' : `${g} 채권 합계`}</td>${oc(d, 'sums', g, '채권액', 'num')}</tr>`;
  return `<p class="doc-note">채권자별 채권액과 합계입니다.</p>${h}</tbody></table></div>`;
}

function renderApp() {
  const d = 'app';
  const label = { 일반: '일반 채권 총액', 우선권: '우선권 채권 총액', 총합계: '채권 총액' };
  let h = `<div class="table-wrap"><table class="data"><tbody>`;
  for (const g of GROUPS) h += `<tr><th>${label[g]}</th>${oc(d, 'sums', g, '채권액', 'num')}</tr>`;
  return `<p class="doc-note">채권액 관련 칸만 보여 줍니다.</p>${h}</tbody></table></div>`;
}

// 10-8. 이력
function renderHistory() {
  const all = state.history.list();
  const keys = [...new Map(all.map(e => [e.필드키, `${e.문서} · ${e.필드}`])).entries()];
  const rows = all.filter(e => !state.histFilter || e.필드키 === state.histFilter).reverse();
  let h = `<div class="hist-tools"><label>필드로 보기
    <select id="histFilter"><option value="">전체</option>${keys.map(([k, l]) =>
      `<option value="${esc(k)}" ${k === state.histFilter ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
    <span class="muted">이력은 추가만 됩니다.</span></div>`;
  if (!rows.length) return h + '<p class="empty">아직 처리한 지적이 없습니다.</p>';
  h += `<div class="table-wrap"><table class="data"><thead><tr><th>시각</th><th>처리자</th><th>문서·필드</th><th class="num">변경 전</th><th class="num">변경 후</th>
    <th>원본 위치</th><th>구분</th><th>사유</th><th>반영 문서</th></tr></thead><tbody>`;
  for (const e of rows) {
    h += `<tr><td>${esc(e.시각)}</td><td>${esc(e.처리자)}</td><td>${esc(e.문서)} · ${esc(e.필드)}</td>
      <td class="num">${esc(fmt(e.변경전))}</td><td class="num">${esc(fmt(e.변경후))}</td>
      <td>${esc(e.원본위치.join(' + ') || '—')}</td><td>${chip(e.구분, ACTION_CHIP[e.구분])}</td><td>${esc(e.사유 || '—')}</td><td>${esc(e.반영문서)}</td></tr>`;
  }
  return h + '</tbody></table></div>';
}

// 10-9. 개발자 확인: 프로토 자체 검사. 검사는 페이지가 열릴 때 한 번 실행하고, 결과는 여기서만 보여 줍니다.
let testResults = [];

function renderDevCheck() {
  const pass = testResults.filter(r => r.ok).length;
  let h = `<button class="dev-link" data-act="devcheck" aria-expanded="${ui.devOpen}">개발자 확인: 프로토 자체 검사 ${ui.devOpen ? '▴' : '▾'}</button>`;
  if (ui.devOpen) {
    h += `<div class="dev-panel"><ul>${testResults.map(r =>
      `<li><span class="mark ${r.ok ? 'ok' : 'bad'}">${r.ok ? '✓' : '✗'}</span>${esc(r.name)}</li>`).join('')}</ul>
      <p class="dev-sum ${pass === testResults.length ? 'ok' : 'bad'}">${pass}/${testResults.length} 통과</p></div>`;
  }
  return h;
}

// ── 11. 이벤트
function init() {
  state = initialState();
  reverify();
  testResults = runTests();
  render();

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const { act, key } = el.dataset;
    if (act === 'start') return showScreen('review');
    if (act === 'intake') return showScreen('intake');
    if (act === 'step') return goStep(Number(el.dataset.step));
    if (act === 'devcheck') {
      ui.devOpen = !ui.devOpen;
      render();
      if (ui.devOpen) $('#devcheck').scrollIntoView({ block: 'end', behavior: 'smooth' });
      return;
    }
    if (act === 'select') return selectFlag(key, true);
    if (act === 'edit') {
      const f = state.view.find(v => v.flag.key === key).flag;
      state.editing = { key, action: el.dataset.action };
      state.draft = { value: AMOUNT_COLS.has(f.out.col) ? fmt(f.expected) : String(fmt(f.expected)), reason: '' };
      state.editError = '';
      return selectFlag(key, true);
    }
    if (act === 'confirm') return confirmEdit();
    if (act === 'cancel') { state.editing = null; state.editError = ''; return render(); }
    if (act === 'ltab') { state.leftTab = el.dataset.tab; return render(); }
    if (act === 'rtab') { state.rightTab = el.dataset.tab; return render(); }
    if (act === 'reset') { state = initialState(state.processor); reverify(); return render(); }
  });
  document.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.draft;
    if (k) state.draft[k] = e.target.value;
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'processor') state.processor = e.target.value;
    if (e.target.id === 'histFilter') { state.histFilter = e.target.value; render(); }
  });
}

if (typeof document !== 'undefined') init();
</script>
